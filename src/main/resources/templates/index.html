<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>社員管理システム - メニュー</title>
    <link rel="stylesheet" th:href="@{/css/menu.css}">
</head>
<body>
<header class="app-header">
    <h1>社員管理システム</h1>
    <div class="header-info">
        <span class="user-name">ログインユーザー: 管理者</span>
    </div>
</header>

<main class="menu-container">
    <h2 class="menu-title">メニュー</h2>
    <div class="menu-grid">
        <a th:href="@{/employeelist}" class="menu-card">
            <div class="menu-icon">📋</div>
            <div class="menu-label">社員一覧</div>
            <div class="menu-desc">登録済みの社員を一覧表示します</div>
        </a>

        <a th:href="@{/new}" class="menu-card">
            <div class="menu-icon">➕</div>
            <div class="menu-label">社員登録</div>
            <div class="menu-desc">新しい社員情報を登録します</div>
        </a>

        <a th:href="@{/search}" class="menu-card">
            <div class="menu-icon">🔍</div>
            <div class="menu-label">社員検索</div>
            <div class="menu-desc">条件を指定して社員を検索します</div>
        </a>

        <a th:href="@{/delete}" class="menu-card menu-card--danger">
            <div class="menu-icon">🗑️</div>
            <div class="menu-label">社員削除</div>
            <div class="menu-desc">社員情報を削除します</div>
        </a>
    </div>
</main>

<footer class="app-footer">
    <p>&copy; 2026 Employee Management System</p>
</footer>
</body>
</html>
