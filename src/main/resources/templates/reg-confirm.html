<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>社員管理システム - 登録内容確認</title>
    <link rel="stylesheet" th:href="@{/css/employee-form.css}">
</head>
<body>
<header class="app-header">
    <h1>社員管理システム</h1>
    <div class="header-info">
        <span class="user-name">ログインユーザー: 管理者</span>
    </div>
</header>

<main class="form-container">
    <div class="form-header">
        <h2 class="form-title">登録内容の確認</h2>
    </div>

    <div class="form-card">

        <p class="confirm-lead">以下の内容で登録します。よろしければ「登録する」を押してください。</p>

        <dl class="confirm-list">
            <div class="confirm-row">
                <dt>名前</dt>
                <dd th:text="${employee.name}"></dd>
            </div>
            <div class="confirm-row">
                <dt>メールアドレス</dt>
                <dd th:text="${employee.email}"></dd>
            </div>
            <div class="confirm-row">
                <dt>部署</dt>
                <dd th:text="${employee.department}"></dd>
            </div>
        </dl>

        <form th:action="@{/register}" method="post">
            <input type="hidden" name="name" th:value="${employee.name}">
            <input type="hidden" name="email" th:value="${employee.email}">
            <input type="hidden" name="department" th:value="${employee.department}">

            <div class="form-actions">
                <a th:href="@{/new}" class="btn btn-cancel">修正する</a>
                <button type="submit" class="btn btn-primary">登録する</button>
            </div>
        </form>
    </div>
</main>

<footer class="app-footer">
    <p>&copy; 2026 Employee Management System</p>
</footer>
</body>
</html>
